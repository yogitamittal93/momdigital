# docker-compose.prod.yml — PRODUCTION
# Run with: docker compose -f docker-compose.prod.yml up -d
# Secrets pulled from .env.production — never hardcoded here.
# Copy .env.example to .env.production and fill in all values before deploying.

version: '3.9'

services:

  # ── 1. Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. ML / RAG service ─────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not exposed externally — API reaches it on internal Docker network
    expose:
      - "5000"
    env_file: .env.production
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_REPO_ID=${HF_REPO_ID}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./ml_service/data:/app/data
      - matrny_db_cache:/app/matrny_db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s # ChromaDB + model load can take 60-90s on cold start

  # ── 3. DB migration (one-shot, blocks api from starting) ───────────────────
  db-migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    env_file: .env.production
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    # No restart — if migration fails we want a clear failure, not a retry loop
    restart: "no"

  # ── 4. NestJS API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:5000
      - CLIENT_URL=${CLIENT_URL}
      - CLIENT_URLS=${CLIENT_URLS}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 5. Next.js frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked in at build time — must be the public-facing API URL
        # (what the user's browser will call, not internal Docker hostname)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  matrny_db_cache:
