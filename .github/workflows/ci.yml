name: Quality Gate & Deploy

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'        # Must match Dockerfile.api and Dockerfile.web
  PYTHON_VERSION: '3.11'   # Must match Dockerfile.ml_service
  API_PORT: '3001'
  WEB_PORT: '3000'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build & Lint
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Lint — API (NestJS)
        run: npm run lint -w api

      - name: Lint — Web (Next.js)
        run: npm run lint -w web

      - name: Build — API
        run: npm run build -w api
        env:
          NODE_ENV: production

      - name: Build — Web
        run: npm run build -w web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:${{ env.API_PORT }}/api

      - name: Upload API build
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist
          retention-days: 1

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-next
          path: web/.next
          retention-days: 1
          include-hidden-files: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: API Unit Tests (Jest)
# Runs in parallel with ML tests — does not need Playwright or a running server.
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: API Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm run test -w api
        env:
          NODE_ENV: test
          # Jest mocks PrismaService and RedisService — no real DB/Redis needed
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          DIRECT_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_ACCESS_SECRET: ci_access_secret_unit_test
          JWT_REFRESH_SECRET: ci_refresh_secret_unit_test

      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: api/coverage/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: ML Service Tests (pytest)
# ─────────────────────────────────────────────────────────────────────────────
  ml-tests:
    name: ML Service Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml_service/requirements.txt

      - name: Install ML service dependencies
        working-directory: ml_service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ml_service
        run: python -m pytest tests/ --tb=short --junitxml=pytest-results.xml
        env:
          # Tests use mocked ChromaDB and Groq — no real keys needed
          GROQ_API_KEY: ci_mock_key
          HF_REPO_ID: mock/repo
          HF_TOKEN: ci_mock_token

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ml_service/pytest-results.xml
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Playwright E2E Tests
# Waits for validate + unit-tests to pass before spinning up servers.
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E
    needs: [validate, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mom_user
          POSTGRES_PASSWORD: mom_password
          POSTGRES_DB: mom_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service — avoids relying on graceful fallback behaviour
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Generate Prisma client (required after npm ci in e2e job)
        working-directory: api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable

      - name: Install Playwright browsers (Chromium only for speed)
        run: npx playwright install chromium --with-deps

      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-next
          path: web/.next

      - name: Run Prisma migrations (test DB)
        working-directory: api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable

      - name: Start API server (background)
        working-directory: api
        run: |
          node dist/src/main.js > ../api_server.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: test
          PORT: ${{ env.API_PORT }}
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci_access_secret_do_not_use_in_prod' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_refresh_secret_do_not_use_in_prod' }}
          CLIENT_URL: http://127.0.0.1:${{ env.WEB_PORT }}
          CLIENT_URLS: http://127.0.0.1:${{ env.WEB_PORT }}
          REDIS_URL: redis://127.0.0.1:6379
          # ML_SERVICE_URL set to mock URL — chatbot E2E tests are skipped in CI,
          # but a valid URL format is required by config validation
          ML_SERVICE_URL: http://127.0.0.1:5000
          GROQ_API_KEY: ci_mock_key
          GOOGLE_CLIENT_ID: ci_mock_google_id
          GOOGLE_CLIENT_SECRET: ci_mock_google_secret
          GOOGLE_CALLBACK_URL: http://127.0.0.1:3001/api/auth/google/callback
          GITHUB_CLIENT_ID: ci_mock_github_id
          GITHUB_CLIENT_SECRET: ci_mock_github_secret
          GITHUB_CALLBACK_URL: http://127.0.0.1:3001/api/auth/github/callback

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on port ${{ env.API_PORT }}..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${{ env.API_PORT }}/api/health > /dev/null 2>&1; then
              echo "API is up!"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "API failed to start! Printing server logs:"
          cat api_server.log
          exit 1

      - name: Start Next.js server (background, reuse build artifact)
        working-directory: web
        run: |
          echo "=== Directory contents of web/ ==="
          ls -la
          echo "=== Directory contents of web/.next/ ==="
          ls -la .next || echo ".next directory not found!"
          npm run start > ../web_server.log 2>&1 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ env.API_PORT }}/api

      - name: Wait for Next.js to be ready
        run: |
          echo "Waiting for Next.js on port ${{ env.WEB_PORT }}..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${{ env.WEB_PORT }} > /dev/null 2>&1; then
              echo "Next.js is up!"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "Next.js failed to start! Printing server logs:"
          cat web_server.log
          exit 1

      - name: Run Playwright smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=list,junit
        env:
          BASE_URL: http://127.0.0.1:${{ env.WEB_PORT }}
          BASE_API_URL: http://127.0.0.1:${{ env.API_PORT }}/api
          CI: 'true'

      - name: Print API logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat api_server.log || echo "No api_server.log found"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: playwright-report/results.xml
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5: Deploy to Production
# Only runs on push to master/main (not on PRs) after all tests pass.
# Uses SSH to pull latest image and restart via docker compose.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [e2e-tests, ml-tests]
    runs-on: ubuntu-latest
    # Only deploy on direct push to master/main — never on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Pulling latest code..."
            git pull origin master

            echo "Building and restarting services..."
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for health checks..."
            sleep 15

            echo "Verifying API health..."
            curl -sf http://localhost:3001/api/health || (echo "API health check failed" && exit 1)

            echo "Verifying ML service health..."
            curl -sf http://localhost:5000/health || (echo "ML service health check failed" && exit 1)

            echo "Cleaning up old Docker images..."
            docker image prune -f

            echo "Deploy complete."