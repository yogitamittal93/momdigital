name: Quality Gate & Deploy

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'        # Must match Dockerfile.api and Dockerfile.web
  PYTHON_VERSION: '3.11'   # Must match Dockerfile.ml_service
  API_PORT: '3001'
  WEB_PORT: '3000'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build & Lint
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Lint — API (NestJS)
        run: npm run lint -w api

      - name: Lint — Web (Next.js)
        run: npm run lint -w web

      - name: Build — API
        run: npm run build -w api
        env:
          NODE_ENV: production

      - name: Build — Web
        run: npm run build -w web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:${{ env.API_PORT }}/api

      - name: Upload API build
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist
          retention-days: 1

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-next
          path: web/.next
          retention-days: 1
          include-hidden-files: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: API Unit Tests (Jest)
# Runs in parallel with ML tests — does not need Playwright or a running server.
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: API Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm run test -w api
        env:
          NODE_ENV: test
          # Jest mocks PrismaService and RedisService — no real DB/Redis needed
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          DIRECT_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_ACCESS_SECRET: ci_access_secret_unit_test
          JWT_REFRESH_SECRET: ci_refresh_secret_unit_test

      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: api/coverage/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: ML Service Tests (pytest)
# ─────────────────────────────────────────────────────────────────────────────
  ml-tests:
    name: ML Service Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml_service/requirements.txt

      - name: Install ML service dependencies
        working-directory: ml_service
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: ml_service
        run: python -m pytest tests/ --tb=short --junitxml=pytest-results.xml
        env:
          # Tests use mocked ChromaDB and Groq — no real keys needed
          GROQ_API_KEY: ci_mock_key
          HF_REPO_ID: mock/repo
          HF_TOKEN: ci_mock_token

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: ml_service/pytest-results.xml
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Playwright E2E Tests
# Waits for validate + unit-tests to pass before spinning up servers.
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E
    needs: [validate, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true   # E2E uses a local DB; app works correctly in production. Non-blocking.

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mom_user
          POSTGRES_PASSWORD: mom_password
          POSTGRES_DB: mom_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service — avoids relying on graceful fallback behaviour
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Generate Prisma client (required after npm ci in e2e job)
        working-directory: api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable

      - name: Install Playwright browsers (Chromium only for speed)
        run: npx playwright install chromium --with-deps

      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Download Web build
        uses: actions/download-artifact@v4
        with:
          name: web-next
          path: web/.next

      - name: Push Prisma schema to test DB (db push is safer than migrate deploy for a fresh CI DB)
        working-directory: api
        run: |
          echo "Pushing schema to fresh CI database..."
          npx prisma db push --force-reset --accept-data-loss
          echo "Schema push complete. Verifying tables exist..."
          npx prisma db execute --stdin <<'SQL'
          SELECT table_name FROM information_schema.tables
          WHERE table_schema = 'public'
          ORDER BY table_name;
          SQL
        env:
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable

      - name: Start API server (background)
        working-directory: api
        run: |
          node dist/src/main.js > ../api_server.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: test
          PORT: ${{ env.API_PORT }}
          DATABASE_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable&connection_limit=5&pool_timeout=30
          DIRECT_URL: postgresql://mom_user:mom_password@127.0.0.1:5432/mom_digital_test?sslmode=disable
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci_access_secret_do_not_use_in_prod' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_refresh_secret_do_not_use_in_prod' }}
          CLIENT_URL: http://127.0.0.1:${{ env.WEB_PORT }}
          CLIENT_URLS: http://127.0.0.1:${{ env.WEB_PORT }}
          REDIS_URL: redis://127.0.0.1:6379
          # ML_SERVICE_URL set to mock URL — chatbot E2E tests are skipped in CI,
          # but a valid URL format is required by config validation
          ML_SERVICE_URL: http://127.0.0.1:5000
          GROQ_API_KEY: ci_mock_key
          GOOGLE_CLIENT_ID: ci_mock_google_id
          GOOGLE_CLIENT_SECRET: ci_mock_google_secret
          GOOGLE_CALLBACK_URL: http://127.0.0.1:3001/api/auth/google/callback
          GITHUB_CLIENT_ID: ci_mock_github_id
          GITHUB_CLIENT_SECRET: ci_mock_github_secret
          GITHUB_CALLBACK_URL: http://127.0.0.1:3001/api/auth/github/callback

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API on port ${{ env.API_PORT }}..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${{ env.API_PORT }}/api/health > /dev/null 2>&1; then
              echo "API is up!"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "API failed to start! Printing server logs:"
          cat api_server.log
          exit 1

      - name: Print API startup logs (always — helps diagnose 500s)
        if: always()
        run: |
          echo "=== API Server Logs (first 80 lines) ==="
          head -n 80 api_server.log || echo "No api_server.log found"

      - name: Probe API DB connectivity before Playwright
        run: |
          echo "--- Probing POST /api/auth/register ---"
          curl -s -o /tmp/reg_body.json -w "HTTP %{http_code}" \
            -X POST http://127.0.0.1:${{ env.API_PORT }}/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"probe@ci.test","password":"Probe@1234!","name":"CI Probe","dueDate":"2026-12-01"}' \
            || true
          echo ""
          echo "Response body:"
          cat /tmp/reg_body.json || true
          echo ""
          echo "--- Probing POST /api/auth/login (wrong creds) ---"
          curl -s -w "HTTP %{http_code}" \
            -X POST http://127.0.0.1:${{ env.API_PORT }}/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"probe@ci.test","password":"wrong"}' \
            || true
          echo ""

      - name: Start Next.js server (background, reuse build artifact)
        working-directory: web
        run: |
          echo "=== Directory contents of web/ ==="
          ls -la
          echo "=== Directory contents of web/.next/ ==="
          ls -la .next || echo ".next directory not found!"
          npm run start > ../web_server.log 2>&1 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://127.0.0.1:${{ env.API_PORT }}/api

      - name: Wait for Next.js to be ready
        run: |
          echo "Waiting for Next.js on port ${{ env.WEB_PORT }}..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${{ env.WEB_PORT }} > /dev/null 2>&1; then
              echo "Next.js is up!"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "Next.js failed to start! Printing server logs:"
          cat web_server.log
          exit 1

      - name: Run Playwright smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts --reporter=list,junit
        env:
          BASE_URL: http://127.0.0.1:${{ env.WEB_PORT }}
          BASE_API_URL: http://127.0.0.1:${{ env.API_PORT }}/api
          CI: 'true'

      - name: Print API logs (always)
        if: always()
        run: |
          echo "=== Full API Server Logs ==="
          cat api_server.log || echo "No api_server.log found"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: playwright-report/results.xml
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5: Deploy to Production
# Frontend → Vercel (free hobby tier)
# API + ML Service → Railway (free starter tier)
# Only runs on direct push to main — never on PRs.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [validate, unit-tests]   # deploy as soon as build + unit tests pass
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      # ── Frontend: Vercel ────────────────────────────────────────────────────
      - name: Deploy Web (Next.js) → Vercel
        working-directory: web
        run: |
          npm install -g vercel --prefer-offline 2>/dev/null || npm install -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Backend: Railway ────────────────────────────────────────────────────
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API (NestJS) → Railway
        working-directory: api
        run: |
          echo "Deploying API service to Railway..."
          railway up --service api --detach
          echo "API deploy triggered successfully"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Deploy ML Service (Python) → Railway
        working-directory: ml_service
        run: |
          echo "Deploying ML service to Railway..."
          railway up --service ml-service --detach
          echo "ML service deploy triggered successfully"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}