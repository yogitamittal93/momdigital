name: Quality Gate & Integration

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci # This installs root, web, and api because of workspaces

      - name: Lint (Parallel)
        run: |
          npm run lint -w api || echo "Lint warnings in API"
          npm run lint -w web || echo "Lint warnings in Web"

      - name: Build All
        run: npm run build --workspaces
        env:
          NODE_ENV: production

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            api/dist
            web/.next
          retention-days: 1

  e2e-tests:
    name: Playwright Integration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        # We run from the root using the playwright.config.ts we discussed
        run: npx playwright test tests/e2e/smoke.spec.ts
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/