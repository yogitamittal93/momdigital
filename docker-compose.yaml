services:
  # 1. The Local Database
  db:
    image: postgres:17-alpine
    container_name: mom-db
    restart: always
    environment:
      POSTGRES_USER: mom_user
      POSTGRES_PASSWORD: mom_password
      POSTGRES_DB: mom_digital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The NestJS API (Backend)
  api:
    build:
      context: ./api
    container_name: mom-api
    ports:
      - "3001:3001"  # must match PORT env var below
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Use the "db" service name — not localhost — inside Docker network
      DATABASE_URL: "postgresql://mom_user:mom_password@db:5432/mom_digital?schema=public"
      JWT_ACCESS_SECRET: "change-me-in-production"
      JWT_REFRESH_SECRET: "change-me-in-production-refresh"
      CLIENT_URL: "http://localhost:3000"
      CLIENT_URLS: "http://localhost:3000"
    depends_on:
      - db
    volumes:
      - ./api:/app
      - /app/node_modules

  # 3. The Next.js App (Frontend)
  web:
    build:
      context: ./web
    container_name: mom-web
    ports:
      - "3000:3000"  # Next.js on localhost:3000
    environment:
      # Use the "api" Docker service name — not localhost — for server-side fetches
      - NEXT_PUBLIC_API_URL=http://api:3001/api
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data: