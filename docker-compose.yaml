# docker-compose.yaml — LOCAL DEVELOPMENT
# Run with: docker compose up
# All secrets pulled from .env at the project root — never hardcoded here.
# Copy .env.example to .env and fill in the values before first run.
#
# Generate strong JWT secrets:
#   node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
# Run twice — one for JWT_ACCESS_SECRET, one for JWT_REFRESH_SECRET

services:

  # ── 1. PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: mom-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mom_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mom_password}
      POSTGRES_DB: ${DB_NAME:-mom_digital}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-mom_user} -d ${DB_NAME:-mom_digital}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. ML / RAG service (Python Flask) ────────────────────────────────────
  ml:
    build:
      context: ./ml_service
    container_name: mom-ml
    restart: always
    expose:
      - "5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_REPO_ID=${HF_REPO_ID}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - matrny_db_cache:/app/matrny_db
      - ./ml_service/data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── 4. NestJS API ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    container_name: mom-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: "postgresql://${DB_USER:-mom_user}:${DB_PASSWORD:-mom_password}@db:5432/${DB_NAME:-mom_digital}?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: "http://localhost:3000"
      CLIENT_URLS: "http://localhost:3000"
      ML_SERVICE_URL: "http://ml:5000"
      REDIS_URL: "redis://redis:6379"
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
      - uploads:/app/uploads
    # Dev: run migrations then start in watch mode
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  # ── 5. Next.js frontend ────────────────────────────────────────────────────
  web:
    build:
      context: ./web
    container_name: mom-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Browser calls go to localhost:3001 (user's machine, not Docker network)
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  matrny_db_cache:
  uploads:
